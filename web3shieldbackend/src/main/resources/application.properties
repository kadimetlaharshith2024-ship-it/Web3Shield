# ==========================================
# Application Identity
# ==========================================
spring.application.name=web3shield-backend
server.port=${PORT:8085}


# ==========================================
# PostgreSQL Database Configuration
# ==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chainshield}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver


# ==========================================
# JPA / Hibernate Configuration
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false


# ==========================================
# Flyway
# ==========================================
spring.flyway.enabled=false


# ==========================================
# Alchemy RPC Configuration - Ethereum Mainnet
# ==========================================
chainshield.alchemy.rpc-url=${ALCHEMY_ETH_URL}
alchemy.rpc-url=${ALCHEMY_ETH_URL}

# Used by Web3j / AccessGuard


# ==========================================
# Etherscan Configuration
# ==========================================
chainshield.etherscan.api-key=${ETHERSCAN_API_KEY:}
chainshield.etherscan.chain-id=${ETHERSCAN_CHAIN_ID:1}
chainshield.etherscan.api-url=https://api.etherscan.io/api

etherscan.api-key=${ETHERSCAN_API_KEY:}
etherscan.chain-id=${ETHERSCAN_CHAIN_ID:1}


# ==========================================
# Gemini AI Configuration
# ==========================================
gemini.api.key=${GEMINI_API_KEY:}


# ==========================================
# Logging
# ==========================================
logging.level.com.web3shield=INFO
logging.level.org.springframework.web=INFO
web3.rpc-url=https://eth-mainnet.g.alchemy.com/v2/alch_GnMADts8UC15udqJeBV8R
